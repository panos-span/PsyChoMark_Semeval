[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "psycomark"
version = "1.0.0"
description = "PsyCoMark: Psycholinguistic Conspiracy Marker Extraction & Endorsement Detection (SemEval-2026 Task 10)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Panagiotis Spanakis"},
    {name = "Maria Lymperaiou"},
    {name = "Giorgos Filandrianos"},
    {name = "Athanasios Voulodimos"},
    {name = "Giorgos Stamou"},
]

[tool.uv]
managed = true

dependencies = [
    "pydantic>=2.0",
    "pydantic-ai>=0.1",
    "langgraph>=0.2",
    "chromadb>=0.5",
    "openai>=1.30",
    "loguru>=0.7",
    "tenacity>=8.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio",
    "ruff",
]
eval = [
    "scikit-learn>=1.4",
]
rerank = [
    "sentence-transformers>=3.0",
    "torch>=2.0",
    "scikit-learn>=1.4",
]
eda = [
    "pandas>=2.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scipy>=1.11",
]
ragbuilder = [
    "tqdm>=4.66",
]
bedrock = [
    "boto3>=1.34",
]

[project.scripts]
psycomark = "psycomark.run:main"

[tool.setuptools.packages.find]
include = ["psycomark*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
